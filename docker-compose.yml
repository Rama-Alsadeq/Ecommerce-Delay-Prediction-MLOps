services:

  postgresql:
    image: postgres:17
    container_name: postgresql1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - "5433:5432"
    volumes:
      - postgres_data1:/var/lib/postgresql/data

  python:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: python1
    ports:
      - "8888:8888"
    volumes:
      - .:/app
    depends_on:
      - postgresql

volumes:
  postgres_data1: