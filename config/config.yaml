project:
  name: brazilian-e-commerce-qafza

paths:
  artifacts: artifacts
  feature_engineering: artifacts/feature_engineering
  models: artifacts/models
  data: data

models:
  classification: artifacts/models/classification/logistic_regression_smote.joblib
  regression: artifacts/models/regression/random_forest_exp1.joblib

preprocessing:
  scaler: artifacts/feature_engineering/scaler.joblib
  geo_mean_delay_maps: artifacts/feature_engineering/geo_mean_delay_maps.joblib
  global_mean_delay: artifacts/feature_engineering/global_mean_delay.joblib
  feature_names: artifacts/feature_engineering/feature_names.json
  preprocessing_config: artifacts/feature_engineering/preprocessing_config.json

targets:
  classification: delayed
  regression: delay_days

api:
  host: 0.0.0.0
  port: 8000

mlflow:
  tracking_uri: http://mlflow:5000
  model_name: Brazilian-E-Commerce-Classifier
  model_version: "1"

monitoring:
  prediction_log: logs/predictions.jsonl
  reference_distribution: artifacts/monitoring/reference_prediction_distribution.json
  min_samples_for_drift: 30
  thresholds:
    error_rate: 0.05
    latency_ms: 500
    psi_warning: 0.10
    psi_alert: 0.20
